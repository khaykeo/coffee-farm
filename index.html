<title>Coffee Farm · ສວນກາເຟ</title>
<style>
:root{
  --brown:#4b2e1e;--brown2:#6b422c;--sand:#c8a46e;--bg:#f6f4ef;--card:#fff;--text:#2b2118;
  --muted:#7a6f66;--green:#198754;--red:#dc3545;--blue:#0d6efd;--orange:#fd7e14;--purple:#6f42c1;
  --line:#e8e2d8;--radius:14px;
  --font:'Noto Sans Lao','Phetsarath OT','Saysettha OT','Lao Sangam MN','Leelawadee UI',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans',Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.8}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
h3{margin:0 0 6px;font-size:15px;line-height:1.7}
.wrap{max-width:720px;margin:0 auto;padding:12px}
header.top{position:sticky;top:0;z-index:20;background:var(--brown);color:#fff;
  padding:calc(6px + env(safe-area-inset-top)) 12px 6px;display:flex;align-items:center;gap:8px}
header.top .back{color:#fff;text-decoration:none;font-size:26px;line-height:1;padding:0 8px 4px 0}
header.top .ttl{flex:1;min-width:0}
header.top .app{font-weight:700;font-size:15px;line-height:1.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .sub{font-size:12px;opacity:.8;line-height:1.6}
.lang{display:flex;border:1px solid #ffffff55;border-radius:999px;overflow:hidden}
.lang button{background:transparent;border:0;color:#fff;padding:2px 11px;font:inherit;font-size:13px;line-height:1.7}
.lang button.on{background:var(--sand);color:var(--brown);font-weight:700}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav.tabs a{flex:1;text-align:center;padding:5px 2px 4px;color:var(--muted);text-decoration:none;font-size:11px;line-height:1.5}
nav.tabs a.on{color:var(--brown);font-weight:700}
nav.tabs a .ic{display:block;font-size:21px;line-height:1.3}
.card{background:var(--card);border-radius:var(--radius);box-shadow:0 1px 3px #0001;padding:12px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border-radius:var(--radius);border-left:5px solid var(--brown);box-shadow:0 1px 3px #0001;padding:8px 10px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted);line-height:1.6}
.kpi .v{font-size:18px;font-weight:700;line-height:1.5;word-break:break-word}
.kpi .s{font-size:11px;color:var(--muted);line-height:1.6}
.pos{color:var(--green)}.neg{color:var(--red)}.mut{color:var(--muted)}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:8px 10px;margin-bottom:8px;box-shadow:0 1px 2px #0001;cursor:pointer}
.item .ic{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;color:#fff}
.item .ic.inc{background:var(--green)}.item .ic.exp{background:var(--red)}.item .ic.hv{background:var(--purple)}.item .ic.pl{background:var(--sand);color:var(--brown)}
.item .mid{flex:1;min-width:0}
.item .t{font-weight:600;line-height:1.6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{font-size:12px;color:var(--muted);line-height:1.6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .amt{font-weight:700;white-space:nowrap;text-align:right}
.chips{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:1px 14px;font:inherit;font-size:14px;color:var(--text);line-height:1.8}
.chip.on{background:var(--brown);border-color:var(--brown);color:#fff}
.badge{display:inline-block;font-size:12px;border-radius:999px;padding:0 9px;color:#fff;line-height:1.7;white-space:nowrap}
.b-done{background:var(--green)}.b-planned{background:#6c757d}.b-overdue{background:var(--red)}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;
  border:0;background:var(--brown);color:#fff;font-size:32px;line-height:1;box-shadow:0 4px 12px #0004;z-index:19}
.btn{display:inline-block;border:0;border-radius:10px;padding:6px 16px;font:inherit;font-size:15px;line-height:1.8;background:var(--brown);color:#fff;text-align:center;text-decoration:none}
.btn.sec{background:#fff;color:var(--brown);border:1px solid var(--brown)}
.btn.red{background:var(--red)}
.btn.block{display:block;width:100%;margin-bottom:8px}
.btn.sm{padding:2px 12px;font-size:14px}
.search{width:100%;padding:6px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:16px;margin-bottom:10px;background:#fff}
.alert{background:#fff3cd;border:1px solid #ffe69c;border-radius:12px;padding:8px 12px;margin-bottom:12px;font-size:14px;line-height:1.7}
.alert.red{background:#f8d7da;border-color:#f1aeb5}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--font);fill:#6c757d}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);line-height:1.7;margin-top:2px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.dl{font-size:13px;line-height:1.7}
.dl div{display:flex;justify-content:space-between;gap:8px;padding:1px 0}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px;line-height:1.6}
th,td{padding:4px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{background:#faf7f1;font-weight:600}
tr.good td{background:#e9f6ee}
.menu a{display:flex;align-items:center;gap:12px;color:var(--text);text-decoration:none;padding:10px 4px;border-bottom:1px solid var(--line)}
.menu a:last-child{border-bottom:0}
.menu .ic{font-size:22px}
.menu .arr{margin-left:auto;color:var(--muted)}
/* sheet */
.ovl{position:fixed;inset:0;background:#0006;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:720px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 8px;font-size:18px;line-height:1.7}
label.f{display:block;font-size:13px;color:var(--muted);margin:8px 0 0;line-height:1.7}
input,select,textarea{width:100%;padding:7px 10px;border:1px solid #d6cfc3;border-radius:10px;font:inherit;font-size:16px;line-height:1.8;background:#fff;color:var(--text)}
textarea{min-height:64px}
.chk{display:flex;align-items:center;gap:10px;margin:12px 0;font-size:15px}
.chk input{width:22px;height:22px;flex:none}
.row2{display:flex;gap:8px;margin-top:14px}
.row2 .btn{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:#222;color:#fff;border-radius:999px;padding:4px 18px;font-size:14px;z-index:60;max-width:90%}
.hint{font-size:12px;color:var(--muted);line-height:1.7;margin-top:2px}
.sec-t{font-weight:700;margin:14px 0 6px;font-size:15px}
.guide h4{margin:0 0 2px;font-size:15px;line-height:1.7}
.guide p{margin:0 0 10px;font-size:14px}
</style>
</head>

function today(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function p2(n){return (n<10?'0':'')+n;}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function ymd(s){var a=String(s||'').slice(0,10).split('-');return [+a[0]||1970,+a[1]||1,+a[2]||1];}
function addDays(s,n){var a=ymd(s),d=new Date(Date.UTC(a[0],a[1]-1,a[2]+n));return d.getUTCFullYear()+'-'+p2(d.getUTCMonth()+1)+'-'+p2(d.getUTCDate());}
function daysBetween(a,b){var x=ymd(a),y=ymd(b);return Math.round((Date.UTC(y[0],y[1]-1,y[2])-Date.UTC(x[0],x[1]-1,x[2]))/86400000);}
function addYears(s,n){var a=ymd(s),d=a[2];if(a[1]===2&&d===29)d=28;return (a[0]+n)+'-'+p2(a[1])+'-'+p2(d);}
function farmYear(start,ds){var s=ymd(start),x=ymd(ds);var n=x[0]-s[0]-((x[1]<s[1]||(x[1]===s[1]&&x[2]<s[2]))?1:0)+1;return Math.max(n,1);}
function num(v,d){var n=parseFloat(String(v==null?'':v).replace(/,/g,'').trim());return isFinite(n)?n:(d===undefined?0:d);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function n0(v){return v==null||!isFinite(v)?'-':Math.round(v).toLocaleString('en-US');}
function n1(v){return v==null||!isFinite(v)?'-':(Math.round(v*10)/10).toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1});}
function n2(v){return v==null||!isFinite(v)?'-':(Math.round(v*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}

function normalize(d){
  if(!d||typeof d!=='object')throw new Error('bad');
  var s=Object.assign(JSON.parse(JSON.stringify(DEFAULT_SETTINGS)),d.settings||{});
  if(!s.startDate)s.startDate=today();

  function arr(a){return Array.isArray(a)?a.filter(function(x){return x&&typeof x==='object';}):[];}
  var out={v:1,settings:s,plots:arr(d.plots),tx:arr(d.tx),harvests:arr(d.harvests),tasks:arr(d.tasks)};
  [out.plots,out.tx,out.harvests,out.tasks].forEach(function(a){a.forEach(function(r){if(!r.id)r.id=uid();});});
  return out;
}

/* ======================= calculations ======================= */
function parseList(text,n){
  var vals=[];String(text||'').split(/[,\s;]+/).forEach(function(x){if(x!==''){var f=parseFloat(x);if(isFinite(f))vals.push(f);}});
  if(!vals.length)vals=[0];while(vals.length<n)vals.push(vals[vals.length-1]);return vals.slice(0,n);
}
function cfg(){
  var s=DB.settings,years=Math.max(1,Math.round(num(s.leaseYears,10)));
  return {area:num(s.areaHa,3.5),lease:num(s.leaseLak,28e6),years:years,fx:Math.max(1,num(s.fx,22000)),price:num(s.priceUsd,5),
    capex:num(s.capexUsd,18000),start:s.startDate||today(),yields:parseList(s.yields,years),opex:parseList(s.opex,years)};
}
function projection(c,price){
  var leaseUsd=c.lease/c.fx,cum=-c.capex,low=cum,be=null,rows=[];
  for(var i=0;i<c.years;i++){
    var kg=c.yields[i]*c.area*1000,rev=kg*price,opex=c.opex[i]+leaseUsd,net=rev-opex,prev=cum;cum+=net;
    if(be===null&&cum>=0&&net>0)be=i+(prev<0?(-prev/net):0);
    low=Math.min(low,cum);
    rows.push({year:i+1,yieldHa:c.yields[i],kg:kg,revenue:rev,opex:opex,net:net,cum:cum});
  }
  return {rows:rows,be:be,peak:-low,end:cum};
}
function breakevenPrice(c){
  var cost=c.capex+c.opex.reduce(function(a,b){return a+b;},0)+(c.lease/c.fx)*c.years;
  var kg=c.yields.reduce(function(a,b){return a+b;},0)*c.area*1000;return kg>0?cost/kg:null;
}

/* ======================= charts (inline SVG, no libraries) ======================= */
var PALETTE=['#4b2e1e','#198754','#0d6efd','#fd7e14','#6f42c1','#dc3545','#20c997','#c8a46e','#6c757d','#d63384','#0dcaf0'];
function niceScale(min,max,n){
  if(max===min)max=min+1;var range=max-min,raw=range/n,mag=Math.pow(10,Math.floor(Math.log(raw)/Math.LN10)),norm=raw/mag;
  var step=(norm<=1?1:norm<=2?2:norm<=5?5:10)*mag;return {lo:Math.floor(min/step+1e-9)*step,hi:Math.ceil(max/step-1e-9)*step,step:step};
}
function axisFmt(v){var a=Math.abs(v);if(a>=100)return Math.round(v).toLocaleString('en-US');return String(Math.round(v*10)/10);}
function legend(items){return '<div class="legend">'+items.map(function(i){return '<span><i style="background:'+i.color+'"></i>'+esc(i.name)+'</span>';}).join('')+'</div>';}
function scaleFor(series){
  var vals=[];series.forEach(function(s){s.data.forEach(function(v){if(v!=null&&isFinite(v))vals.push(v);});});
  var mn=Math.min.apply(null,[0].concat(vals)),mx=Math.max.apply(null,[0].concat(vals));
  if(!vals.length){mn=0;mx=1;}return niceScale(mn,mx,5);
}
function grid(sc,W,H,pl,pr,pt,pb){
  var out='';for(var v=sc.lo;v<=sc.hi+sc.step*1e-6;v+=sc.step){
    var y=pt+(sc.hi-v)*(H-pt-pb)/(sc.hi-sc.lo);
    out+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="'+(Math.abs(v)<1e-9?'#8a7f75':'#ece6dc')+'" stroke-width="'+(Math.abs(v)<1e-9?1.6:1)+'"/>';
    out+='<text x="'+(pl-6)+'" y="'+(y+5)+'" font-size="15" text-anchor="end">'+axisFmt(v)+'</text>';
  }return out;
}
function lineChart(labels,series){
  var W=640,H=290,pl=58,pr=14,pt=12,pb=34,sc=scaleFor(series),n=labels.length;
  var x=function(i){return pl+(n<=1?(W-pl-pr)/2:i*(W-pl-pr)/(n-1));};
  var y=function(v){return pt+(sc.hi-v)*(H-pt-pb)/(sc.hi-sc.lo);};
  var out='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img">'+grid(sc,W,H,pl,pr,pt,pb);
  var every=Math.ceil(n/8);
  labels.forEach(function(l,i){if(i%every===0||i===n-1)out+='<text x="'+x(i)+'" y="'+(H-10)+'" font-size="15" text-anchor="middle">'+esc(l)+'</text>';});
  series.forEach(function(s){
    var d='',pen=false,dots='';
    s.data.forEach(function(v,i){if(v==null||!isFinite(v)){pen=false;return;}d+=(pen?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)+' ';pen=true;
      dots+='<circle cx="'+x(i).toFixed(1)+'" cy="'+y(v).toFixed(1)+'" r="3.6" fill="'+s.color+'"/>';});
    out+='<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"'+(s.dash?' stroke-dasharray="7 5"':'')+'/>'+dots;
  });
  return out+'</svg>'+legend(series.map(function(s){return {name:s.name,color:s.color};}));
}
function barChart(labels,series){
  var W=640,H=270,pl=58,pr=10,pt=12,pb=34,sc=scaleFor(series),n=labels.length;
  var gw=(W-pl-pr)/n,bw=gw*0.74/series.length;
  var y=function(v){return pt+(sc.hi-v)*(H-pt-pb)/(sc.hi-sc.lo);};
  var out='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img">'+grid(sc,W,H,pl,pr,pt,pb);
  var every=Math.ceil(n/7);
  labels.forEach(function(l,i){if(i%every===0||i===n-1)out+='<text x="'+(pl+gw*i+gw/2)+'" y="'+(H-10)+'" font-size="15" text-anchor="middle">'+esc(l)+'</text>';});
  series.forEach(function(s,si){s.data.forEach(function(v,i){
    var x0=pl+gw*i+gw*0.13+bw*si,y0=y(0),y1=y(v),top=Math.min(y0,y1),h=Math.abs(y1-y0);
    out+='<rect x="'+x0.toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(h,0).toFixed(1)+'" rx="2" fill="'+s.color+'"/>';});});
  return out+'</svg>'+legend(series.map(function(s){return {name:s.name,color:s.color};}));
}
function donut(items,centerText){
  var tot=items.reduce(function(a,b){return a+b.value;},0);if(tot<=0)return '';
  var r=62,C=2*Math.PI*r,off=0,out='<svg class="chart" viewBox="0 0 200 200" style="max-width:240px;margin:0 auto" role="img"><g transform="rotate(-90 100 100)">';
  items.forEach(function(it,i){var len=it.value/tot*C;
    out+='<circle cx="100" cy="100" r="'+r+'" fill="none" stroke="'+PALETTE[i%PALETTE.length]+'" stroke-width="30" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'"/>';off+=len;});
  out+='</g><text x="100" y="106" font-size="17" text-anchor="middle" style="fill:#2b2118;font-weight:700">'+esc(centerText)+'</text></svg>';
  out+='<div class="dl" style="margin-top:6px">'+items.map(function(it,i){
    return '<div><span><i style="display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;background:'+PALETTE[i%PALETTE.length]+'"></i>'+esc(it.label)+'</span><span>'+n1(it.value)+' ('+Math.round(it.value/tot*100)+'%)</span></div>';}).join('')+'</div>';
  return out;
}

function pageHome(){
  var c=cfg(),fx=c.fx,tx=DB.tx,inc=0,exp=0,leasePaid=0,byYear={};
  tx.forEach(function(r){var a=num(r.amount);if(isInc(r.cat))inc+=a;else exp+=a;if(r.cat==='lease')leasePaid+=a;
    var y=farmYear(c.start,r.date);byYear[y]=(byYear[y]||0)+(isInc(r.cat)?a:-a);});
  var net=inc-exp,leaseTotal=c.lease*c.years,cur=farmYear(c.start,today());
  var years=Object.keys(byYear).map(Number),last=Math.max.apply(null,[cur].concat(years)),n=Math.max(c.years,last);
  var plan=projection(c,c.price),labels=[],planCum=[],actual=[],cum=0;
  for(var i=1;i<=n;i++){labels.push(t('yearN',{n:i}));planCum.push(i<=c.years?Math.round(plan.rows[i-1].cum*fx/1e4)/100:null);
    cum+=(byYear[i]||0);actual.push(i<=last?Math.round(cum/1e4)/100:null);}
  var gKg=0,cKg=0,hVal=0;DB.harvests.forEach(function(h){gKg+=num(h.greenKg);cKg+=num(h.cherryKg);hVal+=num(h.greenKg)*num(h.priceLak);});

  var html='';
  var hasData=tx.length+DB.harvests.length+DB.tasks.length>0,lb=DB.settings.lastBackup;
  if(hasData&&(!lb||daysBetween(lb.slice(0,10),today())>30))
    html+='<div class="alert">'+esc(t('b_warn'))+' <button class="btn sm" data-act="exportJson" style="margin-top:4px">'+esc(t('b_btn'))+'</button></div>';
  html+='<div class="grid2">'+
    kpi(t('k_expense'),n0(exp)+' '+t('kip'),'≈ $'+n0(exp/fx),'#dc3545')+
    kpi(t('k_income'),n0(inc)+' '+t('kip'),t('k_recovered',{p:n1(exp?inc/exp*100:0)}),'#198754')+
    kpi(t('k_net'),n0(net)+' '+t('kip'),'≈ $'+n0(net/fx),net>=0?'#198754':'#dc3545',net>=0?'pos':'neg')+
    kpi(t('k_year'),cur+' / '+c.years,t('k_ends',{d:leaseEnd,n:n0(daysLeft)}),'#0d6efd')+
    kpi(t('k_leasePaid'),n0(leasePaid),t('k_ofTotal',{v:n0(leaseTotal)}),'#fd7e14')+
    kpi(t('k_green'),n1(gKg),t('k_greenSub',{c:n1(cKg),v:n0(hVal)}),'#6f42c1')+
    kpi(t('k_area'),n2(area)+' ha',t('k_areaSub',{t:n0(trees),n:DB.plots.length}),'#20c997')+
    kpi(t('k_be'),plan.be!=null?t('k_beVal',{y:n1(plan.be)}):t('k_noBe'),bep?t('k_beSub',{p:n2(bep),l:n0(bep*fx),pp:c.price}):'','#c8a46e')+'</div>';
  html+='<div class="card"><h3>'+esc(t('c_cum'))+'</h3>'+lineChart(labels,[{name:t('c_plan'),color:'#6c757d',dash:true,data:planCum},{name:t('c_actual'),color:'#198754',data:actual}])+'</div>';
  // monthly
  var mm={};tx.forEach(function(r){var m=String(r.date).slice(0,7);if(!mm[m])mm[m]={i:0,e:0};if(isInc(r.cat))mm[m].i+=num(r.amount);else mm[m].e+=num(r.amount);});
  var months=Object.keys(mm).sort().slice(-12);
  if(months.length)html+='<div class="card"><h3>'+esc(t('c_month'))+'</h3>'+barChart(months.map(function(m){return m.slice(2).replace('-','/');}),
    [{name:t('c_inc'),color:'#198754',data:months.map(function(m){return Math.round(mm[m].i/1e4)/100;})},{name:t('c_exp'),color:'#dc3545',data:months.map(function(m){return Math.round(mm[m].e/1e4)/100;})}])+'</div>';
  // categories
  var cs={};tx.forEach(function(r){if(!isInc(r.cat))cs[r.cat]=(cs[r.cat]||0)+num(r.amount);});
  var items=Object.keys(cs).map(function(k){return {label:t('cat_'+k),value:cs[k]/1e6};}).sort(function(a,b){return b.value-a.value;});
  if(items.length)html+='<div class="card"><h3>'+esc(t('c_cat'))+'</h3>'+donut(items,n1(exp/1e6))+'</div>';
  // tasks
  var up=DB.tasks.filter(function(x){return x.status!=='done';}).sort(function(a,b){return String(a.date).localeCompare(String(b.date));}).slice(0,5);
  html+='<div class="card"><h3>'+esc(t('d_upcoming'))+'</h3>'+(up.length?up.map(taskRow).join(''):'<div class="mut">'+esc(t('d_noTasks'))+'</div>')+'</div>';
  return shell('home','title_home',html);

  }else if(f.opts==='plots'){h+=opt('','-')+DB.plots.map(function(p){return opt(p.id,p.name);}).join('');}
  else if(f.opts==='kinds'){h+=KINDS.map(function(k){return opt(k,t('kind_'+k));}).join('');}
  else if(f.opts==='status'){h+=opt('planned',t('st_planned'))+opt('done',t('st_done'));}
  return h;
}
function openSheet(type,id){
  var F=FORMS[type],rec=id?DB[F.coll].find(function(r){return r.id===id;}):null,isNew=!rec;
  if(!isNew&&!rec)return;
  var html='<div class="ovl" id="ovl"><form class="sheet" id="sheetForm" novalidate><h2>'+esc((isNew?t('add'):t('edit'))+' · '+t(F.title))+'</h2>';
  F.fields.forEach(function(f){
    if(f.newOnly&&!isNew)return;
    var val=rec?rec[f.n]:(f.def==='today'?today():(f.def!=null?f.def:''));
    var label=t('f_'+f.n);
    if(f.t==='checkbox'){html+='<label class="chk"><input type="checkbox" name="'+f.n+'" checked><span>'+esc(label)+'</span></label>';return;}
    html+='<label class="f">'+esc(label)+(f.req?' *':'')+'</label>';
    if(f.t==='select')html+='<select name="'+f.n+'">'+optionsHTML(f,val)+'</select>';
    else if(f.t==='textarea')html+='<textarea name="'+f.n+'">'+esc(val)+'</textarea>';
    else if(f.t==='number')html+='<input type="number" step="any" inputmode="decimal" name="'+f.n+'" value="'+esc(val)+'">';
    else html+='<input type="'+f.t+'" name="'+f.n+'" value="'+esc(val)+'">';
  });
  html+='<div class="row2"><button type="button" class="btn sec" data-act="closeSheet">'+esc(t('cancel'))+'</button><button class="btn">'+esc(t('save'))+'</button></div>'+
    (isNew?'':'<div class="row2"><button type="button" class="btn red" data-act="deleteRec" data-t="'+type+'" data-id="'+esc(id)+'">'+esc(t('del'))+'</button></div>')+'</form></div>';
  closeSheet();document.body.insertAdjacentHTML('beforeend',html);document.body.style.overflow='hidden';
  var form=document.getElementById('sheetForm');
  form.addEventListener('submit',function(e){e.preventDefault();saveSheet(type,id);});
  document.getElementById('ovl').addEventListener('click',function(e){if(e.target.id==='ovl')closeSheet();});
}
function closeSheet(){var o=document.getElementById('ovl');if(o)o.remove();document.body.style.overflow='';}
function saveSheet(type,id){
  var F=FORMS[type],form=document.getElementById('sheetForm'),rec={},missing=[],isNew=!id,makeIncome=false;
  F.fields.forEach(function(f){
    if(f.newOnly&&!isNew)return;
    var el=form.elements[f.n];if(!el)return;
    if(f.t==='checkbox'){makeIncome=el.checked;return;}
    var v=el.value.trim();
    if(f.t==='number')v=v===''?'':num(v);
    if(f.req&&(v===''||v==null))missing.push(t('f_'+f.n));
    rec[f.n]=v;
  });
  if(missing.length){toast(t('fillRequired',{f:missing.join(', ')}));return;}
  var coll=DB[F.coll];
  if(isNew){rec.id=uid();coll.push(rec);}
  else{var ex=coll.find(function(r){return r.id===id;});Object.assign(ex,rec);}
  if(type==='harvest'&&isNew&&makeIncome&&num(rec.greenKg)>0&&num(rec.priceLak)>0){
    DB.tx.push({id:uid(),date:rec.date,cat:'saleGreen',amount:num(rec.greenKg)*num(rec.priceLak),plotId:rec.plotId||'',
      desc:t('h_saleDesc',{kg:n1(num(rec.greenKg))})+(rec.buyer?t('h_saleTo',{b:rec.buyer}):'')});
  }
  save();closeSheet();render();toast(t('saved'));
}
function deleteRec(type,id){
  if(!confirm(t('confirmDel')))return;
  var F=FORMS[type];DB[F.coll]=DB[F.coll].filter(function(r){return r.id!==id;});
  if(type==='plot'){['tx','harvests','tasks'].forEach(function(k){DB[k].forEach(function(r){if(r.plotId===id)r.plotId='';});});}
  save();closeSheet();render();toast(t('deleted'));
}

/* ======================= backup / export ======================= */
function download(name,text,mime){
  var blob=new Blob([text],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(url);a.remove();},1500);
}
function backupName(){return 'coffee_farm_backup_'+today()+'.json';}
function markBackup(){DB.settings.lastBackup=new Date().toISOString();save();}
function exportJson(){download(backupName(),JSON.stringify(DB,null,1),'application/json');markBackup();render();toast(t('saved'));}
function canShareFiles(){try{return !!(navigator.share&&navigator.canShare&&typeof File==='function'&&navigator.canShare({files:[new File(['{}'],'a.json',{type:'application/json'})]}));}catch(e){return false;}}
function shareJson(){
  var file=new File([JSON.stringify(DB,null,1)],backupName(),{type:'application/json'});
  navigator.share({files:[file],title:'Coffee Farm backup'}).then(function(){markBackup();render();}).catch(function(){});
}
function csvCell(v){v=v==null?'':String(v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function exportCsv(kind){
  var rows,head,body;
  if(kind==='tx'){head=['date','type','category','amount_lak','plot','description'];
    body=DB.tx.slice().sort(function(a,b){return String(a.date).localeCompare(String(b.date));}).map(function(r){return [r.date,isInc(r.cat)?'income':'expense',t('cat_'+r.cat),num(r.amount),plotName(r.plotId),r.desc];});}
  else if(kind==='harvests'){head=['date','plot','cherry_kg','green_kg','price_lak_per_kg','value_lak','buyer','notes'];
    body=DB.harvests.map(function(h){return [h.date,plotName(h.plotId),h.cherryKg,h.greenKg,h.priceLak,num(h.greenKg)*num(h.priceLak),h.buyer,h.notes];});}
  else if(kind==='tasks'){head=['date','task','plot','status','notes'];
    body=DB.tasks.map(function(x){return [x.date,t('kind_'+x.kind),plotName(x.plotId),x.status,x.notes];});}
  else{head=['name','area_ha','trees','variety','planted_on','notes'];body=DB.plots.map(function(p){return [p.name,p.areaHa,p.trees,p.variety,p.plantedOn,p.notes];});}
  rows=[head].concat(body);
  download('coffee_farm_'+kind+'_'+today()+'.csv','\ufeff'+rows.map(function(r){return r.map(csvCell).join(',');}).join('\r\n'),'text/csv;charset=utf-8');
}
function importJson(file){
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var d=JSON.parse(rd.result);if(!d||typeof d!=='object'||!d.settings||!Array.isArray(d.tx))throw new Error('bad');
      var nd=normalize(d);
      if(!confirm(t('s_importConfirm')))return;
      DB=nd;save();applyLang();render();toast(t('s_importOk'));
    }catch(e){toast(t('s_importFail'));}
  };
  rd.readAsText(file);
}
function demoDB(){
  var db=freshDB(L());db.settings.startDate=addDays(today(),-400);
  var s=db.settings.startDate,p1=db.plots[0].id,p2id=uid();
  db.plots[0].areaHa=2.5;db.plots[0].trees=4600;db.plots[0].plantedOn=addDays(s,40);
  db.plots.push({id:p2id,name:I18N[L()].plotB,areaHa:1,trees:1900,variety:'Catimor',plantedOn:addDays(s,60),notes:''});
  var T=[[0,'lease',28000000,''],[5,'prep',45000000,p1],[20,'seedlings',60000000,p1],[25,'shade',15000000,p1],[30,'irrigation',90000000,p1],
    [45,'buildings',120000000,''],[90,'fertilizer',12000000,p1],[120,'labor',20000000,''],[365,'lease',28000000,''],[380,'fertilizer',14000000,p1]];
  T.forEach(function(x){db.tx.push({id:uid(),date:addDays(s,x[0]),cat:x[1],amount:x[2],plotId:x[3],desc:''});});
  db.harvests.push({id:uid(),date:addDays(today(),-12),plotId:p1,cherryKg:40,greenKg:7,priceLak:110000,buyer:'',notes:''});
  db.tx.push({id:uid(),date:addDays(today(),-12),cat:'saleGreen',amount:7*110000,plotId:p1,desc:I18N[L()].h_saleDesc.replace('{kg}','7.0')});
  db.tasks.push({id:uid(),date:addDays(today(),-20),kind:'weeding',plotId:p1,status:'done',notes:''},
    {id:uid(),date:addDays(today(),-5),kind:'pruning',plotId:p1,status:'planned',notes:''},
    {id:uid(),date:addDays(today(),2),kind:'watering',plotId:p2id,status:'planned',notes:''},
    {id:uid(),date:addDays(today(),7),kind:'fertilizing',plotId:p1,status:'planned',notes:''});
  return db;
}

/* ======================= routing & events ======================= */
var PAGES={home:pageHome,money:pageMoney,harvest:pageHarvest,tasks:pageTasks,more:pageMore,plots:pagePlots,proj:pageProj,guide:pageGuide,settings:pageSettings};
function currentRoute(){var h=(location.hash||'').replace(/^#\/?/,'').split('?')[0];return PAGES[h]?h:'home';}
function applyLang(){document.documentElement.lang=L()==='en'?'en':'lo';document.title=farmName()+' · '+t('appName');}
function render(){
  var r=currentRoute();applyLang();
  document.getElementById('app').innerHTML=PAGES[r]();
  var q=document.getElementById('moneyQ');
  if(q)q.addEventListener('input',function(){UI.moneyQ=q.value;document.getElementById('moneyList').innerHTML=moneyList();});
}
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;var a=el.getAttribute('data-act'),v=el.getAttribute('data-v');
  if(a==='lang'){DB.settings.lang=v;save();render();}
  else if(a==='add')openSheet(v,null);
  else if(a==='edit'){if(e.target.closest('button[data-act="done"]'))return;openSheet(el.getAttribute('data-t'),el.getAttribute('data-id'));}
  else if(a==='done'){e.stopPropagation();var x=DB.tasks.find(function(r){return r.id===el.getAttribute('data-id');});if(x){x.status='done';save();render();toast(t('saved'));}}
  else if(a==='closeSheet')closeSheet();
  else if(a==='deleteRec')deleteRec(el.getAttribute('data-t'),el.getAttribute('data-id'));
  else if(a==='mfilter'){UI.moneyFilter=v;render();}
  else if(a==='tfilter'){UI.taskFilter=v;render();}
  else if(a==='exportJson')exportJson();
  else if(a==='shareJson')shareJson();
  else if(a==='importJson')document.getElementById('importFile').click();
  else if(a==='csv')exportCsv(v);
  else if(a==='demo'){if(confirm(t('s_demoConfirm'))){DB=demoDB();save();render();toast(t('saved'));}}
  else if(a==='reset'){if(confirm(t('s_resetConfirm'))){DB=freshDB(L());save();render();toast(t('deleted'));}}
});
document.addEventListener('submit',function(e){
  var f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();var kind=f.getAttribute('data-form');
  if(kind==='proj'){UI.projPrice=Math.max(0,num(f.elements.price.value,cfg().price));render();}
  else if(kind==='settings'){
    var S=DB.settings;['farmName','location','startDate','yields','opex'].forEach(function(k){var val=f.elements[k].value.trim();if(k==='startDate'&&!val)val=S.startDate;S[k]=val;});
    [['areaHa',3.5],['leaseLak',28e6],['leaseYears',10],['fx',22000],['priceUsd',5],['capexUsd',18000]].forEach(function(p){S[p[0]]=num(f.elements[p[0]].value,p[1]);});
    S.leaseYears=Math.max(1,Math.round(S.leaseYears));S.fx=Math.max(1,S.fx);UI.projPrice=null;
    save();render();toast(t('s_savedSettings'));
  }
});
document.getElementById('importFile').addEventListener('change',function(e){var f=e.target.files&&e.target.files[0];if(f)importJson(f);e.target.value='';});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet();});
window.addEventListener('hashchange',function(){closeSheet();render();window.scrollTo(0,0);});

/* ======================= PWA (works when served over http/https) ======================= */
function setupPWA(){
  if(!/^https?:$/.test(location.protocol))return;
  try{
    var m={name:'Coffee Farm · ສວນກາເຟ',short_name:'Coffee Farm',display:'standalone',background_color:'#f6f4ef',theme_color:'#4b2e1e',
      start_url:location.href.split('#')[0],scope:new URL('./',location.href).href,
      icons:[{src:document.querySelector('link[rel=apple-touch-icon]').href,sizes:'192x192',type:'image/png',purpose:'any'},{src:ICON512,sizes:'512x512',type:'image/png',purpose:'any'}]};
    var link=document.createElement('link');link.rel='manifest';
    link.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));document.head.appendChild(link);
  }catch(e){}
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});
}
